<VirtualHost *:80>
    ServerName 56.228.54.15
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Security headers
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
        Header set X-XSS-Protection "1; mode=block"
        Header set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    </Directory>

    Alias /api /var/www/html/advait-backend/public

    <Directory /var/www/html/advait-backend/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Security headers
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
        Header set X-XSS-Protection "1; mode=block"
        Header set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    </Directory>

    # Error logging
    ErrorLog ${APACHE_LOG_DIR}/advait-error.log
    CustomLog ${APACHE_LOG_DIR}/advait-access.log combined

    # PHP settings
    <IfModule mod_php.c>
        php_value upload_max_filesize 64M
        php_value post_max_size 64M
        php_value max_execution_time 300
        php_value max_input_time 300
    </IfModule>
</VirtualHost>