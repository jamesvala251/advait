<VirtualHost *:80>
    ServerName advaitroadmovers.com
    ServerAlias www.advaitroadmovers.com
    DocumentRoot /var/www/html

    Alias /api /var/www/html/advait-backend/public

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/advait-backend/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>